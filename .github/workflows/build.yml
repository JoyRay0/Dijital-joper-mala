name : Jopa mala

on:

  push:

    branch : ["main"]

jobs: 

  build_and_test:

    runs-on: ubuntu-latest

    steps:

        #github part

      - name: Check out repository
        uses: actions/checkout@v4

        #android part

      - name: Set up Java 17
        uses: actions/setup-java@v5

        with: 
          java-version: '17'
          distribution: 'temurin'

      - name: Check file
        run: |
          pwd
          ls -la
          find . -name gradlew -type f

      - name: Make gradlew executable
        run: chmod +x ./Digital_Joper_mala/gradlew

      - name: Build Debug APK and Run Tests
        run: ./Digital_Joper_mala/gradlew test assembleDebug