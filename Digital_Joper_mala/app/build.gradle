plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mala.digital_joper_mala'
    compileSdk 36

    defaultConfig {
        applicationId "com.mala.digital_joper_mala"
        minSdk 23
        targetSdk 36
        versionCode 15
        versionName "2.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.airbnb.android:lottie:6.6.10'
    implementation("com.squareup.okhttp3:okhttp:5.2.1")
    implementation 'com.mikepenz:actionitembadge:4.0.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation "androidx.work:work-runtime:2.10.5"
    implementation 'androidx.core:core:1.17.0'

    implementation "androidx.room:room-runtime:2.8.2" // Core runtime
    annotationProcessor "androidx.room:room-compiler:2.8.2" // For Java annotation processing


}